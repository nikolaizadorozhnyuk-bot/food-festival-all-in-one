name: Food Festival Weekly Report

on:
  schedule:
    # Запуск щопонеділка о 09:00 за київським часом (07:00 UTC)
    - cron: '0 7 * * 1'
  workflow_dispatch: # Дозволяє запускати звіт вручну для тесту

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run scheduler script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python scheduler.py weekly
